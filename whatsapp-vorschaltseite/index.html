<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Spiritual Touch – WhatsApp</title>
<script>
  // ============================================================
  // KONFIGURATION – nur diese Werte anpassen.
  // ============================================================
  window.ST_CONFIG = {
    // Deine echte WhatsApp-Nummer im Format 49xxxxxxxxxxx (ohne +, ohne Leerzeichen)
    whatsappNumber: "4915758098028",

    // Vorausgefüllter Text, der beim Öffnen von WhatsApp schon im Feld steht
    whatsappPrefill: "Hallo Spiritual Touch, ich habe eine kurze Frage: ",

    // Link zum Amelia-Buchungstool (Termin direkt buchen)
    bookingUrl: "https://spiritual-touch.de/buchen/",

    // Link zur Seite "Kostenloses Vorgespräch"
    vorgesprächUrl: "https://spiritual-touch.de/kostenloses-vorgespraech/",

    // Link zur Preise-Seite
    preiseUrl: "https://spiritual-touch.de/angebot-preise/",

    // Link zur FAQ-Seite
    faqUrl: "https://spiritual-touch.de/faq-fuer-tantramassage-bei-spiritual-touch-in-muenchen/"
  };
</script>
<style>
  :root{
    --wa-header: #008069;
    --wa-header-dark: #075e54;
    --wa-bg: #e5ddd5;
    --wa-bubble: #ffffff;
    --wa-bubble-tail: #ffffff;
    --wa-text: #111b21;
    --wa-text-muted: #667781;
    --wa-green-accent: #25d366;
    --wa-link: #027eb5;
    --wa-input-bg: #f0f2f5;
    --wa-icon: #54656f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --wa-bg: #0b141a;
      --wa-bubble: #202c33;
      --wa-bubble-tail: #202c33;
      --wa-text: #e9edef;
      --wa-text-muted: #8696a0;
      --wa-input-bg: #202c33;
      --wa-icon: #aebac1;
    }
  }
  :root[data-theme="dark"]{
    --wa-bg: #0b141a;
    --wa-bubble: #202c33;
    --wa-bubble-tail: #202c33;
    --wa-text: #e9edef;
    --wa-text-muted: #8696a0;
    --wa-input-bg: #202c33;
    --wa-icon: #aebac1;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:#111b21;
  }
  .page{
    display:flex; justify-content:center; align-items:stretch;
    min-height:100vh; min-height:100dvh;
  }
  .phone{
    width:100%; max-width:480px;
    display:flex; flex-direction:column;
    min-height:100vh; min-height:100dvh;
    background:var(--wa-bg);
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,.35);
  }
  @media (min-width:481px){
    .page{ padding:24px 0; }
    .phone{ min-height:calc(100vh - 48px); min-height:calc(100dvh - 48px); border-radius:12px; overflow:hidden; }
  }
  .chat-wallpaper{
    position:absolute; inset:0;
    background-color:var(--wa-bg);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(0,0,0,.035) 0, transparent 40%),
      radial-gradient(circle at 85% 10%, rgba(0,0,0,.03) 0, transparent 35%),
      radial-gradient(circle at 50% 60%, rgba(0,0,0,.03) 0, transparent 40%),
      radial-gradient(circle at 20% 85%, rgba(0,0,0,.03) 0, transparent 35%),
      radial-gradient(circle at 90% 80%, rgba(0,0,0,.035) 0, transparent 40%);
    opacity:.7;
    pointer-events:none;
  }

  /* Header */
  .wa-header{
    display:flex; align-items:center; gap:12px;
    padding:10px 12px;
    background:var(--wa-header);
    color:#fff;
    position:sticky; top:0; z-index:5;
  }
  .wa-back{ width:22px; height:22px; flex:0 0 auto; opacity:.95; }
  .wa-avatar{
    width:38px; height:38px; border-radius:50%; flex:0 0 auto;
    background:linear-gradient(135deg,#7f6a9c,#b98fc9);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:600; font-size:14px; letter-spacing:.5px;
  }
  .wa-header-text{ flex:1 1 auto; min-width:0; }
  .wa-header-name{ font-size:16px; font-weight:600; line-height:1.2; }
  .wa-header-status{ font-size:12.5px; opacity:.85; line-height:1.2; }
  .wa-header-icons{ display:flex; align-items:center; gap:18px; flex:0 0 auto; }
  .wa-header-icons svg{ width:20px; height:20px; opacity:.95; }

  /* Chat body */
  .wa-body{
    flex:1 1 auto;
    position:relative;
    padding:14px 10px 18px;
    overflow-y:auto;
  }
  .wa-msg-row{ position:relative; z-index:1; display:flex; margin-bottom:8px; }
  .wa-msg-row.center{ justify-content:center; margin:14px 0; }
  .wa-daychip{
    background:rgba(255,255,255,.75); color:#54656f;
    font-size:12.5px; padding:5px 12px; border-radius:8px;
  }
  @media (prefers-color-scheme: dark){ .wa-daychip{ background:#182229; color:#8696a0; } }

  .wa-bubble{
    max-width:84%;
    background:var(--wa-bubble);
    color:var(--wa-text);
    padding:8px 9px 6px 9px;
    border-radius:8px;
    border-top-left-radius:0;
    box-shadow:0 1px .5px rgba(0,0,0,.13);
    font-size:14.5px; line-height:1.4;
    animation:pop .35s ease both;
  }
  .wa-time{
    display:block; text-align:right; font-size:11px; color:var(--wa-text-muted);
    margin-top:2px;
  }

  /* Option "buttons" styled as WhatsApp reply cards */
  .wa-option{
    display:flex; align-items:center; gap:12px;
    width:100%;
    max-width:84%;
    background:var(--wa-bubble);
    color:var(--wa-text);
    border:none;
    text-align:left;
    padding:12px 12px;
    border-radius:8px;
    border-top-left-radius:0;
    box-shadow:0 1px .5px rgba(0,0,0,.13);
    font-family:inherit; font-size:14.5px;
    cursor:pointer;
    text-decoration:none;
    animation:pop .35s ease both;
  }
  .wa-option:active{ filter:brightness(.96); }
  .wa-option-emoji{ font-size:22px; flex:0 0 auto; }
  .wa-option-title{ font-weight:600; }
  .wa-option-sub{ font-size:12.5px; color:var(--wa-text-muted); margin-top:1px; }
  .wa-option-chevron{ margin-left:auto; flex:0 0 auto; color:var(--wa-text-muted); }

  .wa-hint{
    max-width:84%;
    background:transparent;
    color:var(--wa-text-muted);
    font-size:12.5px; line-height:1.5;
    padding:0 9px;
  }
  .wa-hint a{ color:var(--wa-link); text-decoration:none; }
  .wa-hint a:hover{ text-decoration:underline; }

  @keyframes pop{
    from{ opacity:0; transform:translateY(6px) scale(.98); }
    to{ opacity:1; transform:none; }
  }

  .wa-typing{
    display:inline-flex; align-items:center; gap:4px;
    background:var(--wa-bubble); border-radius:8px; border-top-left-radius:0;
    padding:10px 12px; box-shadow:0 1px .5px rgba(0,0,0,.13);
  }
  .wa-typing span{
    width:6px; height:6px; border-radius:50%; background:var(--wa-text-muted);
    animation:blink 1.1s infinite ease-in-out;
  }
  .wa-typing span:nth-child(2){ animation-delay:.15s; }
  .wa-typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; } 40%{ opacity:1; } }

  /* Fake input bar (decorative, opens the "sonstige Frage" WhatsApp chat) */
  .wa-inputbar{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; padding-bottom:calc(8px + env(safe-area-inset-bottom));
    background:transparent;
    position:relative; z-index:2;
  }
  .wa-input{
    flex:1 1 auto;
    display:flex; align-items:center; gap:8px;
    background:var(--wa-input-bg);
    border-radius:24px;
    padding:9px 12px;
    color:var(--wa-text-muted);
    font-size:14.5px;
    cursor:pointer;
    border:none;
    text-align:left;
    font-family:inherit;
  }
  .wa-input svg{ width:20px; height:20px; color:var(--wa-icon); flex:0 0 auto; }
  .wa-mic{
    width:38px; height:38px; border-radius:50%;
    background:var(--wa-header); color:#fff;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    border:none; cursor:pointer;
  }
  .wa-mic svg{ width:19px; height:19px; }

  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
<div class="page">
  <div class="phone">
    <div class="chat-wallpaper" aria-hidden="true"></div>

    <!-- Header -->
    <header class="wa-header">
      <svg class="wa-back" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="wa-avatar">ST</div>
      <div class="wa-header-text">
        <div class="wa-header-name">Spiritual Touch</div>
        <div class="wa-header-status" id="wa-status">meist sofort online</div>
      </div>
      <div class="wa-header-icons">
        <svg viewBox="0 0 24 24" fill="none"><path d="M17 10.5V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-3.5l4 3.5v-11l-4 3.5z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.6" fill="#fff"/><circle cx="12" cy="12" r="1.6" fill="#fff"/><circle cx="12" cy="19" r="1.6" fill="#fff"/></svg>
      </div>
    </header>

    <!-- Chat -->
    <main class="wa-body" id="wa-body">
      <div class="wa-msg-row center"><span class="wa-daychip">Heute</span></div>

      <div class="wa-msg-row" id="row-typing">
        <div class="wa-typing" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>

      <div class="wa-msg-row" id="row-greeting" style="display:none">
        <div class="wa-bubble">
          Hey 👋 schön, dass du da bist.<br>
          Wähle kurz, worum es geht – dann geht's am schnellsten weiter:
          <span class="wa-time" id="time-greeting"></span>
        </div>
      </div>

      <div class="wa-msg-row" id="row-opt1" style="display:none">
        <button class="wa-option" id="btn-booking" type="button">
          <span class="wa-option-emoji">📅</span>
          <span>
            <span class="wa-option-title" style="display:block">Termin buchen</span>
            <span class="wa-option-sub">Direkt einen freien Termin auswählen</span>
          </span>
          <svg class="wa-option-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="wa-msg-row" id="row-opt2" style="display:none">
        <button class="wa-option" id="btn-vorgespraech" type="button">
          <span class="wa-option-emoji">🤍</span>
          <span>
            <span class="wa-option-title" style="display:block">Unsicher? Vorgespräch buchen</span>
            <span class="wa-option-sub">Kostenlos &amp; unverbindlich, 15 Minuten</span>
          </span>
          <svg class="wa-option-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="wa-msg-row" id="row-opt3" style="display:none">
        <button class="wa-option" id="btn-message" type="button">
          <span class="wa-option-emoji">✍️</span>
          <span>
            <span class="wa-option-title" style="display:block">Kurze Nachricht / persönliche Frage</span>
            <span class="wa-option-sub">z. B. „ich komme später" oder ein Sonderwunsch</span>
          </span>
          <svg class="wa-option-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="wa-msg-row" id="row-hint" style="display:none">
        <div class="wa-hint">
          Preise &amp; häufige Fragen stehen meist schon hier:
          <a id="link-preise" href="#" target="_blank" rel="noopener">Preise</a> ·
          <a id="link-faq" href="#" target="_blank" rel="noopener">FAQ</a>
        </div>
      </div>
    </main>

    <!-- Fake input bar – tippt man rein, öffnet sich der echte WhatsApp-Chat -->
    <footer class="wa-inputbar">
      <button class="wa-input" id="btn-input" type="button">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 10.5c0-.4.2-.7.5-.7s.5.3.5.7-.2.7-.5.7-.5-.3-.5-.7zM14.5 10.5c0-.4.2-.7.5-.7s.5.3.5.7-.2.7-.5.7-.5-.3-.5-.7zM8.5 14c1 1 5.5 1 7 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Nachricht</span>
      </button>
      <button class="wa-mic" id="btn-mic" type="button" aria-label="Nachricht senden">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" fill="#fff"/><path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </footer>
  </div>
</div>

<script>
(function(){
  var c = window.ST_CONFIG;

  function waLink(prefillText){
    var text = encodeURIComponent(prefillText || "");
    return "https://wa.me/" + c.whatsappNumber + (text ? ("?text=" + text) : "");
  }

  document.getElementById('link-preise').href = c.preiseUrl;
  document.getElementById('link-faq').href = c.faqUrl;

  document.getElementById('btn-booking').addEventListener('click', function(){
    window.open(c.bookingUrl, '_blank', 'noopener');
  });
  document.getElementById('btn-vorgespraech').addEventListener('click', function(){
    window.open(c.vorgesprächUrl, '_blank', 'noopener');
  });
  function openWhatsApp(){
    window.location.href = waLink(c.whatsappPrefill);
  }
  document.getElementById('btn-message').addEventListener('click', openWhatsApp);
  document.getElementById('btn-input').addEventListener('click', openWhatsApp);
  document.getElementById('btn-mic').addEventListener('click', openWhatsApp);

  // Zeitstempel wie in WhatsApp üblich
  var now = new Date();
  var hh = String(now.getHours()).padStart(2,'0');
  var mm = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('time-greeting').textContent = hh + ':' + mm;

  // Kurze "tippt..."-Animation, dann Nachricht + Optionen einblenden
  var body = document.getElementById('wa-body');
  setTimeout(function(){
    document.getElementById('row-typing').style.display = 'none';
    ['row-greeting','row-opt1','row-opt2','row-opt3','row-hint'].forEach(function(id, i){
      var el = document.getElementById(id);
      setTimeout(function(){
        el.style.display = '';
        body.scrollTop = body.scrollHeight;
      }, i * 160);
    });
  }, 700);
})();
</script>
</body>
</html>
