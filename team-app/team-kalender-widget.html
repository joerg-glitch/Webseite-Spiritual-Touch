<style>
#st{
  --sand:#F3ECE1;--card:#FBF7F0;--plum:#3E2A34;--soft:#6B5560;
  --clay:#B5654A;--clay-d:#9E5440;--line:#E4D9C8;
  --danger:#A24A3E;--danger-bg:#FAF0EE;
  --warn:#C07A2E;--warn-bg:#FDF5EB;--sage:#7E8A6F;
  --r:16px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--plum);line-height:1.45;
  max-width:480px;margin:0 auto;
  background:var(--sand);border-radius:28px;
  padding:36px 24px 56px;
  min-height:520px;
}
#st *{box-sizing:border-box !important;margin:0 !important;padding:0 !important;}

/* Reset — alle theme-Styles raus */
#st button{
  all:unset !important;
  box-sizing:border-box !important;
  cursor:pointer !important;
  -webkit-tap-highlight-color:transparent !important;
}
#st input:not([type=checkbox]){
  all:unset !important;
  box-sizing:border-box !important;
  font-family:inherit !important;
}

/* ── KEYPAD-TASTE — stärker als jedes Elementor-Selector ── */
#st button.st-key{
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  height:72px !important;
  width:100% !important;
  border-radius:var(--r) !important;
  background:var(--card) !important;
  color:var(--plum) !important;
  font-size:26px !important;
  font-weight:500 !important;
  box-shadow:0 2px 0 var(--line) !important;
  transition:.1s !important;
  border:none !important;
  text-align:center !important;
}
#st button.st-key:active{
  transform:translateY(2px) !important;
  box-shadow:none !important;
  background:#EDE4D8 !important;
}
#st button.st-key-ghost{
  background:transparent !important;
  box-shadow:none !important;
  color:var(--soft) !important;
  font-size:17px !important;
}
#st button.st-key:disabled,#st button.st-key-ghost:disabled{
  opacity:.5 !important;cursor:not-allowed !important;
}

/* ── SCREENS ── */
.st-screen{display:none;}
.st-screen.on{display:block;animation:stfade .3s ease;}
@keyframes stfade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}

/* ── TYPO ── */
.st-eyebrow{font-size:11px !important;letter-spacing:3px !important;text-transform:uppercase !important;color:var(--clay) !important;font-weight:600 !important;margin-bottom:6px !important;display:block !important;}
.st-h1{font-size:26px !important;font-weight:600 !important;letter-spacing:-.3px !important;margin-bottom:8px !important;display:block !important;}
.st-lead{color:var(--soft) !important;font-size:15px !important;margin-bottom:28px !important;display:block !important;}
.st-section{font-size:11px !important;letter-spacing:1.5px !important;text-transform:uppercase !important;color:var(--soft) !important;margin-bottom:14px !important;display:block !important;}

/* ── PIN ── */
.st-dots{display:flex !important;gap:16px !important;justify-content:center !important;margin:30px 0 36px !important;}
.st-dot{width:15px !important;height:15px !important;border-radius:50% !important;border:2px solid var(--clay) !important;transition:.18s !important;display:block !important;}
.st-dot.on{background:var(--clay) !important;transform:scale(1.12) !important;}
.st-dot.err{border-color:var(--danger) !important;}
.st-keypad{display:grid !important;grid-template-columns:repeat(3,1fr) !important;gap:12px !important;max-width:300px !important;margin:0 auto !important;}
.st-pin-err{color:var(--danger) !important;font-size:13.5px !important;text-align:center !important;margin-top:16px !important;min-height:20px !important;display:block !important;}

/* ── LIST ── */
.st-topbar{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) !important;
  align-items:baseline !important;column-gap:10px !important;margin-bottom:24px !important;
}
.st-topbar-spacer{display:block !important;}
.st-hello{font-size:23px !important;font-weight:600 !important;text-align:center !important;}
#st button.st-logout{
  font-size:14px !important;color:var(--soft) !important;
  text-decoration:underline !important;text-underline-offset:3px !important;
  background:none !important;padding:0 !important;display:inline !important;
  justify-self:end !important;
}
.st-card{background:var(--card) !important;border-radius:var(--r) !important;padding:16px 18px !important;margin-bottom:12px !important;border:1px solid var(--line) !important;display:block !important;}
.st-card-date{font-size:14px !important;font-weight:600 !important;margin-bottom:2px !important;display:block !important;}
.st-card-time{font-size:20px !important;font-weight:600 !important;color:var(--clay-d) !important;margin:3px 0 8px !important;display:block !important;}
.st-card-bar{height:5px !important;border-radius:3px !important;background:linear-gradient(90deg,var(--clay),#D08A6E) !important;opacity:.35 !important;margin-bottom:12px !important;display:block !important;}
.st-card-act{display:flex !important;gap:20px !important;padding-top:11px !important;border-top:1px solid var(--line) !important;}
#st button.st-edit{color:var(--sage) !important;font-size:14px !important;font-weight:500 !important;display:inline !important;}
#st button.st-del{color:var(--danger) !important;font-size:14px !important;font-weight:500 !important;display:inline !important;}
.st-empty{color:var(--soft) !important;font-size:14px !important;text-align:center !important;padding:28px 0 !important;display:block !important;}
/* ── MENÜLEISTE ── */
.st-menu{
  display:flex !important;gap:8px !important;
  overflow-x:auto !important;overflow-y:hidden !important;
  -webkit-overflow-scrolling:touch !important;
  scrollbar-width:none !important;
  margin-bottom:34px !important;padding-bottom:2px !important;
}
.st-menu::-webkit-scrollbar{display:none !important;}
#st .st-menu-item{
  all:unset !important;
  flex:0 0 auto !important;
  display:flex !important;flex-direction:column !important;align-items:center !important;
  gap:5px !important;width:74px !important;padding:12px 6px !important;
  border-radius:16px !important;background:var(--card) !important;
  border:1px solid var(--line) !important;
  color:var(--soft) !important;font-size:11px !important;font-weight:600 !important;
  text-align:center !important;line-height:1.2 !important;
  overflow-wrap:break-word !important;word-break:break-word !important;
  box-sizing:border-box !important;cursor:pointer !important;
  transition:.1s !important;
  -webkit-tap-highlight-color:transparent !important;
}
#st .st-menu-item:active{transform:translateY(2px) !important;background:#EDE4D8 !important;}
#st .st-menu-ico{font-size:19px !important;line-height:1 !important;}
#st .st-menu-item.primary{background:var(--clay) !important;border-color:var(--clay-d) !important;color:#fff !important;}
#st .st-menu-item.primary:active{background:var(--clay-d) !important;}
#st .st-menu-item.soon{opacity:.55 !important;}

/* ── VERFÜGBARKEITEN-LISTE (eigener Scrollbereich) ── */
.st-entries-wrap{position:relative !important;}
.st-entries-scroll{
  max-height:300px !important;overflow-y:auto !important;
  -webkit-overflow-scrolling:touch !important;
  margin:0 -2px 0 !important;padding:0 2px !important;
}
.st-entries-fade{
  position:absolute !important;left:0 !important;right:0 !important;bottom:0 !important;
  height:32px !important;pointer-events:none !important;
  background:linear-gradient(to bottom, rgba(243,236,225,0), var(--sand)) !important;
  opacity:0 !important;transition:.15s !important;
}
.st-entries-fade.on{opacity:1 !important;}

/* ── TOAST ("Coming Soon") ── */
.st-toast{
  position:fixed !important;left:50% !important;bottom:24px !important;
  transform:translateX(-50%) translateY(20px) !important;
  background:var(--plum) !important;color:#fff !important;
  font-size:13.5px !important;font-weight:500 !important;
  padding:12px 20px !important;border-radius:14px !important;
  opacity:0 !important;pointer-events:none !important;
  transition:.25s !important;z-index:10000 !important;white-space:nowrap !important;
  box-shadow:0 6px 20px rgba(62,42,52,.25) !important;
}
.st-toast.on{opacity:1 !important;transform:translateX(-50%) translateY(0) !important;}

/* ── FORM ── */
#st button.st-back{
  color:var(--soft) !important;font-size:15px !important;
  margin-bottom:20px !important;display:block !important;
}
.st-field{margin-bottom:18px !important;display:block !important;}
.st-field label{display:block !important;font-size:13.5px !important;font-weight:600 !important;margin-bottom:7px !important;}
#st input.st-input{
  display:block !important;width:100% !important;
  padding:14px 15px !important;
  border:1.5px solid var(--line) !important;border-radius:14px !important;
  background:var(--card) !important;font-size:16px !important;color:var(--plum) !important;
}
#st input.st-input:focus{border-color:var(--clay) !important;outline:none !important;}
.st-row{display:flex !important;gap:11px !important;}
.st-row .st-field{flex:1 !important;}

/* Ganztägig-Checkbox */
.st-allday-row{
  display:flex !important;align-items:center !important;gap:12px !important;
  background:var(--card) !important;border:1.5px solid var(--line) !important;
  border-radius:14px !important;padding:14px 15px !important;margin-bottom:18px !important;
  cursor:pointer !important;
}
#st input.st-checkbox{
  -webkit-appearance:none !important;appearance:none !important;
  width:24px !important;height:24px !important;flex-shrink:0 !important;
  border:2px solid var(--line) !important;border-radius:7px !important;
  background:#fff !important;
  display:inline-flex !important;align-items:center !important;justify-content:center !important;
  cursor:pointer !important;transition:.15s !important;
  padding:0 !important;margin:0 !important;
}
#st input.st-checkbox:checked{
  background:var(--clay) !important;border-color:var(--clay) !important;
}
#st input.st-checkbox:checked::after{
  content:'✓' !important;color:#fff !important;font-size:16px !important;font-weight:700 !important;
  line-height:1 !important;
}
.st-allday-label{font-size:15px !important;font-weight:500 !important;color:var(--plum) !important;user-select:none !important;}

/* Warnboxen */
.st-warn,.st-err{display:none !important;border-radius:14px !important;padding:13px 15px !important;margin-bottom:18px !important;gap:11px !important;align-items:flex-start !important;}
.st-warn.on{display:flex !important;background:var(--warn-bg) !important;border:1.5px solid #E4A84E !important;}
.st-err.on{display:flex !important;background:var(--danger-bg) !important;border:1.5px solid #D9897E !important;}
.st-warn-ico,.st-err-ico{font-size:18px !important;flex-shrink:0 !important;}
.st-warn-txt{font-size:13.5px !important;color:var(--plum) !important;}
.st-warn-txt b{color:var(--warn) !important;font-weight:600 !important;}
.st-warn-sub{font-size:12.5px !important;color:var(--soft) !important;margin-top:3px !important;display:block !important;}
.st-err-txt{font-size:13.5px !important;color:var(--danger) !important;}
.st-err-txt b{font-weight:600 !important;}

#st button.st-save{
  display:block !important;width:100% !important;padding:17px !important;margin-top:26px !important;
  border-radius:var(--r) !important;background:var(--clay) !important;color:#fff !important;
  font-size:16px !important;font-weight:600 !important;text-align:center !important;
  box-shadow:0 3px 0 var(--clay-d) !important;transition:.1s !important;
}
#st button.st-save:disabled{background:#C9B5AC !important;box-shadow:none !important;cursor:not-allowed !important;}
#st button.st-save:not(:disabled):active{transform:translateY(3px) !important;box-shadow:none !important;}
#st button.st-cancel{
  display:block !important;width:100% !important;padding:14px !important;margin-top:10px !important;
  border-radius:var(--r) !important;border:1.5px solid var(--line) !important;
  background:transparent !important;color:var(--soft) !important;
  font-size:15px !important;text-align:center !important;
}

/* ── DELETE OVERLAY ──
   Wird per JS an <body> gehängt, deshalb hier bewusst KEINE var(--...)
   Farben (die sind nur innerhalb von #st definiert) — feste Hex-Werte,
   damit die Darstellung unabhängig vom Elementor-Umfeld funktioniert. */
.st-overlay{display:none;position:fixed !important;inset:0 !important;background:rgba(62,42,52,.5) !important;z-index:9999 !important;align-items:center !important;justify-content:center !important;padding:20px !important;}
.st-overlay.on{display:flex !important;}
.st-sheet{background:#FBF7F0 !important;border-radius:22px !important;padding:26px 22px !important;width:100% !important;max-width:360px !important;box-shadow:0 20px 50px -12px rgba(62,42,52,.35) !important;}
.st-sheet-title{font-size:18px !important;font-weight:600 !important;margin-bottom:6px !important;display:block !important;color:#3E2A34 !important;}
.st-sheet-sub{font-size:14px !important;color:#6B5560 !important;margin-bottom:22px !important;display:block !important;}
.st-sheet-err{display:none !important;font-size:13px !important;color:#A24A3E !important;margin-bottom:14px !important;}
.st-sheet-err.on{display:block !important;}
#st-overlay button.st-btn-danger{
  all:unset !important;
  display:block !important;width:100% !important;padding:16px !important;
  border-radius:16px !important;background:#A24A3E !important;
  color:#fff !important;font-size:15px !important;font-weight:600 !important;
  text-align:center !important;margin-bottom:10px !important;
  cursor:pointer !important;box-sizing:border-box !important;transition:background .15s !important;
}
#st-overlay button.st-btn-danger.is-done{background:#7E8A6F !important;}
#st-overlay button.st-btn-danger:disabled{opacity:.85 !important;cursor:default !important;}
#st-overlay button.st-btn-cancel-sheet{
  all:unset !important;
  display:block !important;width:100% !important;padding:14px !important;
  border-radius:16px !important;border:1.5px solid #E4D9C8 !important;
  color:#6B5560 !important;font-size:15px !important;text-align:center !important;
  cursor:pointer !important;box-sizing:border-box !important;
}
#st-overlay button.st-btn-cancel-sheet:disabled{opacity:.5 !important;cursor:default !important;}
</style>

<script>
const ST_API_URL='/wp-json/st/v1/cal';
let stUser=null,stEditId=null,stDelId=null,stPin='',stTimeErr=false,stLoading=false;
let stEntries=[];

// Overlay an <body> hängen: Elementor-Wrapper haben oft ein eigenes
// "transform", wodurch position:fixed sich nur auf den Wrapper statt den
// ganzen Bildschirm bezieht. Als direktes body-Kind ist das ausgeschlossen.
document.body.appendChild(document.getElementById('st-overlay'));

// Ein stiller Wiederholungsversuch, bevor der Nutzer einen Fehler sieht —
// fängt vereinzelte, kurze Aussetzer der Google-Infrastruktur ab
// (Apps Script antwortet dann z.B. mit einer generischen Fehlerseite statt
// JSON, was hier als networkError ankommt).
async function stApi(payload,isRetry){
  try{
    const res=await fetch(ST_API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const data=await res.json();
    return {networkError:false,data};
  }catch(err){
    if(!isRetry){
      await new Promise(r=>setTimeout(r,900));
      return stApi(payload,true);
    }
    return {networkError:true,data:null};
  }
}

function stGo(n){
  document.querySelectorAll('.st-screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('st-'+n).classList.add('on');
  document.getElementById('st').scrollIntoView({behavior:'smooth',block:'start'});
}
let stToastTimer=null;
function stComingSoon(label){
  const t=document.getElementById('st-toast');
  t.textContent='🚧 '+label+' — bald verfügbar';
  t.classList.add('on');
  clearTimeout(stToastTimer);
  stToastTimer=setTimeout(()=>t.classList.remove('on'),1800);
}
function stSetKeypadDisabled(disabled){
  document.querySelectorAll('#st-keypad .st-key').forEach(b=>b.disabled=disabled);
}
function stPress(n){
  if(stLoading||stPin.length>=4)return;
  stPin+=n;stRenderDots();
  if(stPin.length===4)setTimeout(stTryLogin,220);
}
function stDel(){if(stLoading)return;stPin=stPin.slice(0,-1);stRenderDots();}
function stClear(){if(stLoading)return;stPin='';stRenderDots();}
function stRenderDots(){
  for(let i=0;i<4;i++)
    document.getElementById('sd'+i).classList.toggle('on',i<stPin.length);
}
async function stTryLogin(){
  if(stLoading)return;
  stLoading=true;stSetKeypadDisabled(true);
  document.getElementById('st-pin-err').textContent='';
  const pinTried=stPin;
  const {networkError,data}=await stApi({pin:pinTried,action:'list'});
  stLoading=false;stSetKeypadDisabled(false);

  if(networkError){
    document.getElementById('st-pin-err').textContent='Verbindungsfehler — bitte in ein paar Sekunden nochmal versuchen';
    stPin='';stRenderDots();
    return;
  }
  if(data&&data.ok&&data.name){
    stUser=data.name;
    stEntries=Array.isArray(data.entries)?data.entries:[];
    document.getElementById('st-hello').textContent='Hallo '+stUser;
    document.querySelectorAll('.st-dot').forEach(d=>d.classList.remove('err'));
    stRenderList();stGo('list');
  } else {
    document.getElementById('st-pin-err').textContent='Falscher Code — bitte nochmal versuchen';
    document.querySelectorAll('.st-dot').forEach(d=>d.classList.add('err'));
    setTimeout(()=>{stPin='';stRenderDots();document.querySelectorAll('.st-dot').forEach(d=>d.classList.remove('err'));},700);
  }
}
function stLogout(){stUser=null;stPin='';stEntries=[];stRenderDots();stGo('pin');}

async function stRefreshEntries(){
  const {networkError,data}=await stApi({pin:stPin,action:'list'});
  if(!networkError&&data&&data.ok){
    stEntries=Array.isArray(data.entries)?data.entries:[];
  }
  stRenderList();
}

function stRenderList(){
  const el=document.getElementById('st-entries');
  el.innerHTML='';
  el.scrollTop=0;
  if(!stEntries.length){
    el.innerHTML='<div class="st-empty">Noch keine Einträge</div>';
    stUpdateEntriesFade();
    return;
  }
  const s=[...stEntries].sort((a,b)=>a.date.localeCompare(b.date));
  s.forEach(e=>{
    const card=document.createElement('div');
    card.className='st-card';
    card.innerHTML=`
      <span class="st-card-date">${stFmt(e.date)}</span>
      <span class="st-card-time">${e.allDay?'Ganztägig':e.from+' – '+e.to+' Uhr'}</span>
      <span class="st-card-bar"></span>
      <div class="st-card-act"></div>`;
    const act=card.querySelector('.st-card-act');
    const editBtn=document.createElement('button');
    editBtn.className='st-edit';
    editBtn.textContent='Ändern';
    editBtn.addEventListener('click',()=>stOpenForm(e));
    const delBtn=document.createElement('button');
    delBtn.className='st-del';
    delBtn.textContent='Löschen';
    delBtn.addEventListener('click',()=>stOpenDel(e));
    act.appendChild(editBtn);
    act.appendChild(delBtn);
    el.appendChild(card);
  });
  stUpdateEntriesFade();
}
function stUpdateEntriesFade(){
  const el=document.getElementById('st-entries');
  const fade=document.getElementById('st-entries-fade');
  if(!el||!fade)return;
  const hasMore=el.scrollHeight-el.scrollTop-el.clientHeight>4;
  fade.classList.toggle('on',hasMore);
}
function stFmt(iso){
  const d=new Date(iso+'T12:00:00');
  return d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long'});
}
function stOpenForm(entry){
  stEditId=entry?entry.id:null;
  document.getElementById('st-warn').classList.remove('on');
  document.getElementById('st-err').classList.remove('on');
  document.getElementById('st-save').disabled=false;stTimeErr=false;
  if(entry){
    document.getElementById('st-form-title').textContent='Verfügbarkeit ändern';
    document.getElementById('st-date').value=entry.date;
    document.getElementById('st-allday').checked=!!entry.allDay;
    document.getElementById('st-from').value=entry.from||'09:00';
    document.getElementById('st-to').value=entry.to||'18:00';
  } else {
    document.getElementById('st-form-title').textContent='Verfügbarkeit hinzufügen';
    const t=new Date();t.setDate(t.getDate()+1);
    document.getElementById('st-date').value=t.toISOString().split('T')[0];
    document.getElementById('st-allday').checked=false;
    document.getElementById('st-from').value='09:00';
    document.getElementById('st-to').value='18:00';
  }
  stToggleAllDay();
  stCheckDate();stGo('form');
}
function stToggleAllDay(){
  const allDay=document.getElementById('st-allday').checked;
  document.getElementById('st-time-row').style.display=allDay?'none':'flex';
  stCheckTimes();
}
function stCheckDate(){
  const date=document.getElementById('st-date').value;if(!date)return;
  const clash=stEntries.find(e=>e.date===date&&e.id!==stEditId);
  if(clash){
    document.getElementById('st-warn-sub').textContent=stFmt(clash.date)+', '+(clash.allDay?'Ganztägig':clash.from+' – '+clash.to+' Uhr');
    document.getElementById('st-warn').classList.add('on');
  } else {document.getElementById('st-warn').classList.remove('on');}
}
function stCheckTimes(){
  const allDay=document.getElementById('st-allday').checked;
  if(allDay){
    stTimeErr=false;
    document.getElementById('st-err').classList.remove('on');
    document.getElementById('st-save').disabled=false;
    return;
  }
  const f=document.getElementById('st-from').value;
  const t=document.getElementById('st-to').value;
  stTimeErr=!!(f&&t&&t<=f);
  document.getElementById('st-err').classList.toggle('on',stTimeErr);
  document.getElementById('st-save').disabled=stTimeErr;
}
async function stSave(){
  if(stTimeErr||stLoading)return;
  const date=document.getElementById('st-date').value;
  const allDay=document.getElementById('st-allday').checked;
  const from=allDay?'':document.getElementById('st-from').value;
  const to=allDay?'':document.getElementById('st-to').value;
  if(!date)return;
  if(!allDay&&(!from||!to))return;

  stLoading=true;
  document.getElementById('st-save').disabled=true;
  const payload=stEditId
    ?{pin:stPin,action:'update',id:stEditId,date,from,to,allDay}
    :{pin:stPin,action:'create',date,from,to,allDay};
  const {networkError,data}=await stApi(payload);
  stLoading=false;

  if(networkError||!data||!data.ok){
    document.getElementById('st-save').disabled=false;
    document.getElementById('st-err').classList.add('on');
    document.querySelector('#st-err .st-err-txt').innerHTML='<b>Verbindungsfehler</b> — bitte nochmal versuchen.';
    return;
  }
  await stRefreshEntries();
  stGo('list');
}
function stOpenDel(entry){
  stDelId=entry.id;
  document.getElementById('st-del-sub').textContent=stFmt(entry.date)+', '+(entry.allDay?'Ganztägig':entry.from+' – '+entry.to+' Uhr');
  const btn=document.getElementById('st-btn-danger');
  btn.textContent='Ja, löschen';
  btn.disabled=false;
  btn.classList.remove('is-done');
  document.getElementById('st-btn-cancel').disabled=false;
  document.getElementById('st-sheet-err').classList.remove('on');
  document.getElementById('st-overlay').classList.add('on');
}
function stCloseOverlay(){stDelId=null;document.getElementById('st-overlay').classList.remove('on');}
async function stConfirmDel(){
  if(stLoading)return;
  stLoading=true;
  const btn=document.getElementById('st-btn-danger');
  const cancelBtn=document.getElementById('st-btn-cancel');
  const errEl=document.getElementById('st-sheet-err');
  errEl.classList.remove('on');
  btn.textContent='Wird gelöscht …';
  btn.disabled=true;
  cancelBtn.disabled=true;

  const delId=stDelId;
  const {networkError,data}=await stApi({pin:stPin,action:'delete',id:delId});
  stLoading=false;

  if(!networkError&&data&&data.ok){
    btn.textContent='✓ Erledigt';
    btn.classList.add('is-done');
    stEntries=stEntries.filter(e=>e.id!==delId);
    stRenderList();
    setTimeout(()=>{
      stCloseOverlay();
      stRefreshEntries();
    },550);
  } else {
    btn.textContent='Ja, löschen';
    btn.disabled=false;
    cancelBtn.disabled=false;
    errEl.textContent='Verbindungsfehler — bitte nochmal versuchen.';
    errEl.classList.add('on');
  }
}

document.getElementById('st-entries').addEventListener('scroll',stUpdateEntriesFade);
</script>
